services:
  boc:
    image: alpine:3.22
    platform: linux/amd64
    working_dir: /app
    command: ["/app/boc-linux-amd64", "/app/config.json"]
    init: true
    restart: unless-stopped
    volumes:
      - ./boc-linux-amd64:/app/boc-linux-amd64:ro
      - ./config.json:/app/config.json:ro
      - /root/key:/root/key:ro
      - ./data:/app/data
